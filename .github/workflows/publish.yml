# Stages a gatepass-verify release on npm when a v* tag is pushed.
#
# Releases are staged, not published directly. This workflow authenticates
# to npm through trusted publishing (OIDC), with no stored token, and runs
# `npm stage publish`. The version stays private until the maintainer reviews
# and approves it with 2FA on npmjs.com (Staged Packages) or with
# `npm stage approve <stage-id>`. npm adds provenance automatically for
# trusted publishing from GitHub Actions on a public repository.
#
# Trusted publisher on npmjs.com: Swap-neil-spec/gatepass-verify,
# workflow publish.yml, environment npm.

name: publish

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      # Staged publishing needs npm 11.15.0 or later and Node 22.14.0 or later.
      - run: npm install -g npm@latest
      - run: node --version && npm --version
      - name: Check tag matches package version
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package version ${version}" >&2
            exit 1
          fi
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm stage publish --provenance --access public
